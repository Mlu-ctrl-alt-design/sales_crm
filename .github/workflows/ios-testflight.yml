# Builds the Flutter app on a GitHub macOS runner and uploads it to TestFlight.
# Runs only when started by hand (Actions > iOS TestFlight > Run workflow).
# Setup and secrets: docs/TESTFLIGHT.md.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Daystar site the build talks to
        default: https://crm-staging.thedaystar.co.za
        required: true

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_PATH: ${{ github.workspace }}/asc_api_key.p8
    steps:
      - uses: actions/checkout@v4

      # App Store Connect only accepts builds made with a current Xcode/SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true

      - name: Check secrets
        run: |
          for name in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name (see docs/TESTFLIGHT.md)"; exit 1; fi
          done

      - run: flutter pub get
      - run: flutter test

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s' "$ASC_KEY_P8" > "$ASC_KEY_PATH"

      - name: Configure Flutter for Xcode
        run: |
          flutter build ios --release --config-only --no-codesign \
            --dart-define=SITE_URL="${{ inputs.site_url }}" \
            --build-number="${{ github.run_number }}"

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        run: |
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :destination upload" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"
