name: daystar_sales
description: "Daystar Sales mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  http: ^1.6.0
  local_auth: ^3.0.1
  package_info_plus: ^9.0.1
  path_provider: ^2.1.6
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-700.ttf
          weight: 700
        - asset: assets/fonts/Fraunces-800.ttf
          weight: 800
    - family: InterTight
      fonts:
        - asset: assets/fonts/InterTight-400.ttf
          weight: 400
        - asset: assets/fonts/InterTight-500.ttf
          weight: 500
        - asset: assets/fonts/InterTight-600.ttf
          weight: 600
        - asset: assets/fonts/InterTight-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-600.ttf
          weight: 600
